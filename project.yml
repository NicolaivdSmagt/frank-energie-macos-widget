# ABOUTME: XcodeGen project specification for the Frank Energie macOS desktop widget.
# ABOUTME: Defines the host app and widget extension targets, build settings, and dependencies.
name: FrankEnergieWidget
options:
  bundleIdPrefix: nl.frankenergie.widget
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    AD_HOC_CODE_SIGNING_ALLOWED: NO
    ENABLE_APP_SANDBOX: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FrankEnergieApp:
    type: application
    platform: macOS
    sources:
      - path: FrankEnergieApp
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: FrankEnergieApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: nl.frankenergie.widget.app
        PRODUCT_NAME: "Frank Energie Widget"
        PRODUCT_MODULE_NAME: FrankEnergieApp
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: FrankEnergieApp/FrankEnergieApp.entitlements
    dependencies:
      - target: FrankEnergieWidgetExtension

  FrankEnergieWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: FrankEnergieWidget
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: FrankEnergieWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: nl.frankenergie.widget.app.widget
        PRODUCT_NAME: "FrankEnergieWidgetExtension"
        PRODUCT_MODULE_NAME: FrankEnergieWidgetExtension
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES
    entitlements:
      path: FrankEnergieWidget/FrankEnergieWidget.entitlements

  FrankEnergieWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FrankEnergieWidgetTests
      - path: FrankEnergieWidget
        excludes:
          - "FrankEnergieWidgetBundle.swift"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.frankenergie.widget.tests
        PRODUCT_MODULE_NAME: FrankEnergieWidgetTests
    dependencies:
      - target: FrankEnergieApp
      - framework: WidgetKit.framework
        embed: false
      - sdk: AppIntents.framework

schemes:
  FrankEnergieWidget:
    build:
      targets:
        FrankEnergieApp: all
        FrankEnergieWidgetExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FrankEnergieWidgetTests
    archive:
      config: Release
